<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#18263f">
  <!-- Instalação no celular (Android e iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wiki">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Personal Wiki</title>
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
</head>
<body>
  <div id="app"><p class="loading">Carregando…</p></div>
  <!-- config.js é gerado no deploy a partir das variáveis do repositório. -->
  <script src="config.js?v=__VERSION__"></script>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
